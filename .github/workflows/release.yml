name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Restore Android signing files
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEY_PROPERTIES"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
      - run: flutter pub get
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APK and Android App Bundle
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SARVAM_API_KEYS: ${{ secrets.SARVAM_API_KEYS }}
          SARVAM_API_KEY_1: ${{ secrets.SARVAM_API_KEY_1 }}
          SARVAM_API_KEY_2: ${{ secrets.SARVAM_API_KEY_2 }}
          SARVAM_API_KEY_3: ${{ secrets.SARVAM_API_KEY_3 }}
          SARVAM_API_KEY_4: ${{ secrets.SARVAM_API_KEY_4 }}
          SARVAM_API_KEY_5: ${{ secrets.SARVAM_API_KEY_5 }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
        run: |
          # Accept the existing comma/newline-separated pool or five separate
          # secrets. Do not print key values; only the count is logged.
          SARVAM_BUILD_KEYS="$(printf '%s\n' "$SARVAM_API_KEYS" "$SARVAM_API_KEY_1" "$SARVAM_API_KEY_2" "$SARVAM_API_KEY_3" "$SARVAM_API_KEY_4" "$SARVAM_API_KEY_5" | tr '\r\n' ',')"
          SARVAM_BUILD_KEYS="$(printf '%s' "$SARVAM_BUILD_KEYS" | sed -E 's/,+/,/g; s/^,+//; s/,+$//')"
          SARVAM_KEY_COUNT="$(printf '%s' "$SARVAM_BUILD_KEYS" | awk -F',' '{n=0; for (i=1; i<=NF; i++) if ($i ~ /[^[:space:]]/) n++; print n}')"
          test "$SARVAM_KEY_COUNT" -ge 1 || { echo 'SARVAM_API_KEYS is empty; refusing to build a mic-disabled release.'; exit 1; }
          echo "Sarvam key pool configured: $SARVAM_KEY_COUNT key(s)"
          python3 -m pip install --disable-pip-version-check -q websockets
          SARVAM_SMOKE_KEYS="$SARVAM_BUILD_KEYS" python3 - <<'PY'
          import asyncio, os, websockets
          uri = ('wss://api.sarvam.ai/speech-to-text-realtime/ws'
                 '?language_code=auto&model=saaras:v3-realtime&mode=transcribe'
                 '&sample_rate=16000&encoding=linear16&stream_type=fast'
                 '&endpointing=vad&return_timestamps=false')
          async def check():
              keys = [x.strip() for x in os.environ['SARVAM_SMOKE_KEYS'].split(',') if x.strip()]
              async def one(key):
                  try:
                      async with websockets.connect(uri, additional_headers={'API-SUBSCRIPTION-KEY': key}, open_timeout=8) as ws:
                          await asyncio.wait_for(ws.recv(), timeout=8)
                          return True
                  except Exception:
                      return False
              results = await asyncio.gather(*(one(key) for key in keys))
              print(f'Sarvam realtime handshake: {sum(results)}/{len(results)} key(s) accepted')
              if not any(results):
                  raise SystemExit('No Sarvam key was accepted by the realtime endpoint')
          asyncio.run(check())
          PY
          flutter build apk --release --split-per-abi \
            --dart-define="GEMINI_API_KEYS=$GEMINI_API_KEYS" \
            --dart-define="SARVAM_API_KEYS=$SARVAM_BUILD_KEYS" \
            --dart-define="TAVILY_API_KEYS=$TAVILY_API_KEYS"
          flutter build appbundle --release \
            --dart-define="GEMINI_API_KEYS=$GEMINI_API_KEYS" \
            --dart-define="SARVAM_API_KEYS=$SARVAM_BUILD_KEYS" \
            --dart-define="TAVILY_API_KEYS=$TAVILY_API_KEYS"
      - name: Upload signed ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bhasha-keyboard-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: bhasha-keyboard-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload additional ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: bhasha-keyboard-other-release-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*release*.apk
            build/app/outputs/bundle/release/app-release.aab
